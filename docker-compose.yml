services:
  portfolio:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: akash-portfolio

    expose:
      - "3000"

    environment:
      NODE_ENV: production

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: akash-portfolio-nginx

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - portfolio

    restart: unless-stopped